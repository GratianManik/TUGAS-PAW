<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tambah Bengkel</title>
</head>

<body>

    <h1>Tambah Data Bengkel</h1>

    <form>

        <label>Nama Bengkel</label>
        <br>

        <input type="text" name="nama_bengkel">

        <br><br>


        <label>Alamat</label>
        <br>

        <textarea name="alamat"></textarea>

        <br><br>


        <label>Kota</label>
        <br>

        <input type="text" name="kota">

        <br><br>


        <label>Nomor Telepon</label>
        <br>

        <input type="text" name="telepon">

        <br><br>


        <label>Email</label>
        <br>

        <input type="email" name="email">

        <br><br>


        <label>Jenis Layanan</label>
        <br>

        <select name="layanan">

            <option>Service Mesin</option>
            <option>Ganti Oli</option>
            <option>Service Rem</option>
            <option>Service AC</option>

        </select>

        <br><br>


        <label>Status</label>
        <br>

        <select name="status">

            <option>Aktif</option>
            <option>Tidak Aktif</option>

        </select>

        <br><br>


        <button type="submit">
            Simpan Data
        </button>

    </form>

</body>

</html>
